modules:
  jira:issuePanel:
    - key: contextiq-issue-panel
      title: ContextIQ Dashboard
      icon: https://atlassian.com
      resource: main
      render: native
      resolver:
        function: resolver-fn

  trigger:
    - key: jira-trigger
      function: jira-trigger-fn
      events:
        - avi:jira:updated:issue

  function:
    - key: resolver-fn
      handler: backend/index.handler
    - key: jira-trigger-fn
      handler: backend/index.onIssueTransition

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - address: api.github.com

app:
  id: ari:cloud:ecosystem::app/8cdc26a9-0717-4bb6-8f6f-1ec8cc179d84
  runtime:
    name: nodejs22.x
