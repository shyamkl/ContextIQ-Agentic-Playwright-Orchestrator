modules:
  jira:issuePanel:
    - key: contextiq-issue-panel
      title: ContextIQ Dashboard
      icon: https://atlassian.com
      resource: main
      render: native
      resolver:
        function: resolver-fn
  function:
    - key: resolver-fn
      handler: index.handler
    - key: jira-trigger-fn
      handler: index.handleJiraTrigger
      events:
        - name: avi:jira:updated:issue

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  store:
    - read:graph
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
  external:
    fetch:
      backend:
        - address: ://github.com
        - address: "*.githubusercontent.com"

app:
  id: ari:cloud:ecosystem::app/REPLACE-WITH-YOUR-APP-ID
  runtime:
    name: nodejs22.x
